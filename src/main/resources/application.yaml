server:
  port: 8080

spring:
  application:
    name: digital-wallet-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digital_wallet_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Himal123!}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    secret: MYbk+WrVzA3OwivxXMWFjADMUewa4wNIvgZFtgjC/9Y=
    access-token-expiry: 900000
    refresh-token-expiry: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs